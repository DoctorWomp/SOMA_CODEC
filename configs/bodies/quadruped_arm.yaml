# Quadruped with the arm on its dorsal rail (D-36), after the back view of
# docs/concept-art/robot_quadruped_concept.jpg. Same as the quadruped, plus one arm:
# it can point and hand things over. Height is with the arm stowed.
schema_version: "2.0"
body_id: quadruped_arm
display_name: Quadruped with arm
kind: QUADRUPED
dimensions:
  height_m: 0.83            # with the arm stowed flat on the back
  collider: {shape: BOX, length_m: 1.10, width_m: 0.50}
motion:
  max_speed_m_s: 1.6
  max_accel_m_s2: 1.2
  max_turn_rate_rad_s: 1.5
reach_m: 0.9
arms: 1
capabilities:
  can_walk: true
  can_use_stairs: true
  can_use_ramp: true
  can_use_elevator: true
  can_speak: true
  can_gesture: true
  can_grab: true
  can_sit: true
  can_access_staff_areas: false
  can_use_pa: false
sensors:
  mount_height_m: 0.55
  fov_deg: 120
  visual_range_m: 20
  acoustic_range_m: 10
  cadence_hz: 10
  dropout_rate: 0.0
gestures: [HEAD_TILT, SIT_IN_PLACE, POINT, HAND_OVER, WAVE, BECKON, RAISED_HAND]   # gripper wave, beckon, raised gripper for "stop"; never finger gestures (D-36 amendment, owner 2026-11-16)
expression_channels: [SPEECH, LIGHT]
# No neck (D-56): the sensor head is fixed to the body, so LOOK_AT turns the whole body (G3e, D-72).
head: {neck: false}
# Skeleton (rig step A, D-54, D-56): the quadruped plus the 7-bone arm module. The arm's
# gestures play a little calmer: tempo is kept to 0.7-1.3 so the long arm never whips round.
rig:
  skeleton: QUADRUPED
  arm_module: true
  head_turn_speed_deg_s: 90    # no neck: the whole body turns toward a gaze target
  gesture_amplitude: {min: 0.5, max: 1.5}
  gesture_tempo: {min: 0.7, max: 1.3}
  gait: {step_height_m: 0.06, step_length_m: 0.35, cadence_hz: 2.2}   # used from rig step B
