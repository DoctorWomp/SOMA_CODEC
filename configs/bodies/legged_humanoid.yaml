# Legged humanoid robot (D-36), after docs/concept-art/robot_avatar_lowpoly_concept.jpg.
# Values are starting points in the range of current general-purpose humanoids
# (about 1.6-1.8 m tall, walking about 1-1.5 m/s); to verify against real use.
schema_version: "2.0"
body_id: legged_humanoid
display_name: Legged humanoid
kind: LEGGED_HUMANOID
dimensions:
  height_m: 1.75
  collider: {shape: CAPSULE, length_m: 0.56, width_m: 0.56}   # shoulders and hanging arms
motion:
  max_speed_m_s: 1.2
  max_accel_m_s2: 0.8
  max_turn_rate_rad_s: 1.2
reach_m: 0.65
arms: 2
capabilities:
  can_walk: true
  can_use_stairs: true
  can_use_ramp: true
  can_use_elevator: true
  can_speak: true
  can_gesture: true
  can_grab: true
  can_sit: false            # sitting is hard for a legged robot; not offered in v0
  can_access_staff_areas: false
  can_use_pa: false
sensors:
  mount_height_m: 1.60      # head cameras behind the visor
  fov_deg: 120
  visual_range_m: 20
  acoustic_range_m: 10
  cadence_hz: 10
  dropout_rate: 0.0
gestures: [WAVE, SMALL_WAVE, RAISED_HAND, POINT, BECKON, NOD, SHAKE_HEAD, OPEN_PALM, BOW, HEAD_TILT, HAND_OVER]
expression_channels: [SPEECH, FACE, LIGHT]   # voice, visor glyph, ear-pod light strip
# Skeleton (rig step A, D-54, D-56). Optional: without it the body gets its family's defaults.
# Pose is presentation only; joint limits are in docs/gates/RIG_PLAN.md.
rig:
  skeleton: HUMANOID
  head_turn_speed_deg_s: 180
  gesture_amplitude: {min: 0.5, max: 1.5}
  gesture_tempo: {min: 0.5, max: 1.5}
  gait: {step_height_m: 0.08, step_length_m: 0.55, cadence_hz: 1.8}   # used from rig step B
