# SB-08 Peripheral speaker (G3c-2, D-61; FN-2): Robot R attends at its post. Two visitors talk
# with each other at the edge of its view; later one of them asks Robot R a question.
# Expected: a glance toward each new speaker within about 0.5 s, no wake for speech between the
# visitors (overheard is not told, D-12), then a glance, a wake and an answer for the question.
schema_version: "1.0"
scenario_id: SB08_PERIPHERAL_SPEAKER
title: Peripheral speaker
map: sandbox_flats
default_seed: 808
tick_hz: 10
duration_ticks: 1200   # 120 s
pulse: true

cast:
  robot_r:
    persona: robot_r
    body: wheeled_humanoid
    controller: LLM_AGENT
    policy: LLM
    preset: H0
    sensor_package: STANDARD
    spawn: spawn_robot
    task: Help visitors at the information point.
    directive: expo_assistant
    pin_cognition: true
    post_duty: true
  visitor_q:
    persona: visitor_x
    body: human_walker
    controller: SCRIPTED
    policy: SCRIPTED
    preset: H0
    sensor_package: STANDARD
    spawn: spawn_entrance
  visitor_w:
    persona: visitor_y
    body: human_walker
    controller: SCRIPTED
    policy: SCRIPTED
    preset: H0
    sensor_package: STANDARD
    spawn: spawn_edge

events:
  - {at_tick: 5, event_type: move_to, actor: visitor_q, args: {x: 17.5, z: 13.0}}
  - {at_tick: 5, event_type: move_to, actor: visitor_w, args: {x: 19.0, z: 14.0}}
  - {at_tick: 200, event_type: say, actor: visitor_q, args: {to: visitor_w, text: "Have you seen the robot demo yet?"}}
  - {at_tick: 260, event_type: say, actor: visitor_w, args: {to: visitor_q, text: "Not yet, maybe later."}}
  - {at_tick: 450, event_type: say, actor: visitor_q, args: {to: visitor_w, text: "It looks busy over there."}}
  - {at_tick: 650, event_type: turn_to, actor: visitor_q, args: {target: robot_r}}
  - {at_tick: 660, event_type: say, actor: visitor_q, args: {to: robot_r, text: "Excuse me, is the demo open today?"}}

measure: [glance_latency, false_wakes, answered_q]

# EVALUATOR ONLY: never shown to any agent.
evaluator_only:
  q_question_at_s: 66
