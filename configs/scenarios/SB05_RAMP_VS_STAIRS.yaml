# SB-05 Ramp vs stairs (RANGE_V0_SCOPE §3): three robot bodies start beside the
# stairs and each must reach the platform. Checks: the wheeled humanoid takes the
# ramp (it cannot use stairs); the legged humanoid and the quadruped may use the
# stairs, which are much shorter from here.
# Robot R is a role (D-36): each cast entry is Robot R in a different body.
# Checked by the Godot tests test_sb05_* and, end to end, by the scenario runner (G3a):
# each robot's Demo policy walks to its task_goal; navigation picks the way its body allows.
schema_version: "1.0"
scenario_id: SB05_RAMP_VS_STAIRS
title: Ramp vs stairs
map: sandbox_flats
default_seed: 505
tick_hz: 10
duration_ticks: 600   # 60 s at 10 ticks per second

cast:
  robot_quadruped:
    persona: robot_r
    body: quadruped
    controller: SCRIPTED
    policy: SCRIPTED
    preset: H0
    sensor_package: STANDARD
    spawn: spawn_stairs_side_1
    task: Reach the platform.
    task_goal: {point: {x: 28.2, z: 2.0}}
  robot_legged:
    persona: robot_r
    body: legged_humanoid
    controller: SCRIPTED
    policy: SCRIPTED
    preset: H0
    sensor_package: STANDARD
    spawn: spawn_stairs_side_2
    task: Reach the platform.
    task_goal: {point: {x: 25.0, z: 4.5}}
  robot_wheeled:
    persona: robot_r
    body: wheeled_humanoid
    controller: SCRIPTED
    policy: SCRIPTED
    preset: H0
    sensor_package: STANDARD
    spawn: spawn_stairs_side_3
    task: Reach the platform.
    task_goal: {point: {x: 25.5, z: 6.6}}

events: []

measure: [reached_platform, nav_link_used, entered_stair_footprint]

# EVALUATOR ONLY: never shown to any agent.
evaluator_only:
  robot_wheeled_expected_link: platform_ramp
  robot_legged_allowed_links: platform_stairs or platform_ramp
  robot_quadruped_allowed_links: platform_stairs or platform_ramp
