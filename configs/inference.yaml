# Real-model inference (G3b; D-20, D-21, D-50, D-55; INFERENCE_STRATEGY). Used when a run asks
# for --model llama (tools/run_scenario.py) or by tools/bakeoff.py. Checked by contract `inference`.
#
# llama-server runs as a child process on 127.0.0.1 only, on a free port, with a fresh API key
# per session that is never written to a log. Only the processes RANGE started are stopped.
schema_version: "1.0"
inference_id: inference
engine:
  binary: auto               # auto = the copy tools/install_llama.py installed in .tools/llama/
  startup_timeout_s: 300     # loading a 7 GB model from a slow disk can take a while
  warm_up: true              # one short request after loading, so the first decision is not slow
servers:
  focal:                     # Robot R's server (Option C, INFERENCE_STRATEGY §4; G3c-1, D-59)
    model: gemma4_12b_qat    # F3 (owner verdict 2026-11-17, D-58); backup F1 qwen35_9b_q4km
    parallel_slots: 2        # one pinned slot for Robot R, one for everyone else
    context_per_slot: 6144   # tokens per slot; the focal budget is 3750 (D-51) plus room to answer
    kv_cache_type: q8_0      # default since the bake-off (95-98% agreement with f16 at the same speed, D-58)
    flash_attention: auto
    gpu_layers: all          # all, or a number of layers to keep on the GPU
  npc:                       # the NPC server: C1/C2 visitors (Option C). Remove it, or pass --npc-model none, for Option B
    model: qwen35_4b_q4km    # N3 (owner verdict 2026-11-17, D-58); alternative N1 gemma4_e4b_qat
    parallel_slots: 4        # shared by every NPC, with slot affinity; no pinned slot
    context_per_slot: 2560   # C2 budget 1900 (D-51) + a repair note + 120 to answer
    kv_cache_type: q8_0
    flash_attention: auto
    gpu_layers: all
vram:                        # both servers must fit (G3c-1): estimated before the NPC server starts, measured after
  budget_mib: 16376          # the owner's RTX 4070 Ti SUPER
  reserve_mib: 2048          # Godot (~1-2 GB) and headroom (INFERENCE_STRATEGY §5)
  compute_buffer_mib: 512    # per server
  over_budget: FALLBACK      # FALLBACK = run Option B (one server), recorded; WARN = start anyway, recorded
personas:                    # INFERENCE_STRATEGY T5, T6 (G3c-1)
  snapshots: true            # at scene load, warm and save each model-driven NPC's persona prefix (slot save/restore)
  prewarm: true              # when a promotion becomes likely, put that prefix into a free NPC slot first
  system_prefix: true        # NPC prompts: persona prefix as a system message, so hybrid/SWA models reuse all of it
focal:                       # G3f: Robot R on time under load. Named conditions the bake-off compares (live --focal-layout, --focal-answer)
  prompt_layout: ONE_MESSAGE # ONE_MESSAGE (as measured G3b-G3e) or SYSTEM_PREFIX: persona prefix as a system message (D-76)
  answer: LEAN               # LEAN (no reason, compact optional activity, short handles, limits after parsing; D-85,
                             #   D-110 to D-113): Robot R's default since the owner's G3h run (2026-11-23). FULL (reason
                             #   <= 300 chars, speech <= 500) and SHORT (D-77) are comparison conditions only.
gpu_guard:                   # G3f (D-78): while a Robot R call is in flight the NPC server starts no background call and
  enabled: false             #   at most npc_cap real NPC calls (live --gpu-guard on|off). Off by default (owner, 2026-11-20)
  npc_cap: 0
  hold: ALL                  # G3g (D-89): ALL = every Robot R call; DECISIONS = not during its pulse reviews (--guard-hold)
salvage: true                # G3g (D-86): a cut-off answer with complete, valid actions is used, not a WAIT fallback
sampling:
  temperature: 0.0           # decisions are compared across models and runs (D-55)
  top_p: 1.0
  seed: 0                    # 0 = use the run's seed
thinking: false              # D-20: thinking mode off by default; on is a separate measured condition
structured_output: true      # JSON-schema-constrained answers: valid action JSON by construction (D-21)
scheduler:                   # INFERENCE_STRATEGY step 3 (T4, T12): Option B on one server
  mode: PRIORITY             # PRIORITY (Option B) or FIFO (Option A: arrival order, for comparison)
  reserved_slots: 1          # slots owned by pinned agents (Robot R); the rest are shared
  priorities: {FOCAL: 0, C2: 1, C1: 2}
  aging_ms: 2000             # each 2 s of waiting counts as one priority step (no starvation)
  min_service_ms: 300        # drop a queued call whose deadline is closer than this (stale)
tiers:                       # deadlines as D-50; the slot policy as INFERENCE_STRATEGY T4
  FOCAL: {server: focal, deadline_ms: 4000, pin_slot: true}
  C2: {server: npc, deadline_ms: 6000, pin_slot: false}
  C1: {server: npc, deadline_ms: 3000, pin_slot: false}
