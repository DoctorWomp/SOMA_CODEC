name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the baseline (D-06); 3.14 matches the owner's PC and .python-version (D-35).
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      # Godot 4.7.2 for the headless world checks (D-34). The download is verified against
      # the SHA-512 pinned in tools/install_godot.py.
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-4.7.2-stable-linux-x86_64-${{ hashFiles('tools/install_godot.py') }}

      - name: Install Godot 4.7.2 (verified)
        run: uv run --locked python tools/install_godot.py

      - name: Run all checks (Godot required)
        run: uv run --locked python tools/check.py --require-godot
