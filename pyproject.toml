[project]
name = "soma-range"
version = "0.1.0"
description = "SOMA RANGE Python sidecar: HORIZON, agents, comms, evaluation and the headless test world."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# The sidecar is run from the repository, not installed as a package (yet).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
